name: minums_app
description: THE MINUM'S Management System (TMS) - ordering, inventory, attendance and AI assistant.
publish_to: 'none'
version: 1.10.2+12

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  image_picker: ^1.1.2
  http: ^1.2.2
  video_player: ^2.9.2
  intl: '>=0.19.0 <1.0.0'
  material_ui: any

  # Firebase on the free Spark plan: Auth + Firestore + AI Logic (+ App Check, required by AI Logic).
  # Versions are left open: `flutter pub get` picks versions that work with firebase_core.
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/images/splashScreenImage/
    - assets/menu/
